<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="emb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281c"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="copper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background (PCB Texture) -->
  <rect width="600" height="360" fill="url(#emb-bg)"/>

  <!-- PCB Grid & Circuit Lines -->
  <g opacity="0.15" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="45" x2="600" y2="45"/>
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="135" x2="600" y2="135"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="315" x2="600" y2="315"/>
    <line x1="60" y1="0" x2="60" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="420" y1="0" x2="420" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="540" y1="0" x2="540" y2="360"/>
  </g>

  <!-- PCB Copper Traces -->
  <g stroke="url(#copper-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M50 120 L 120 120 L 160 80 L 220 80"/>
    <path d="M50 150 L 140 150 L 180 190 L 220 190"/>
    <path d="M50 240 L 130 240 L 170 280 L 240 280"/>
    <path d="M380 90 L 440 90 L 480 130 L 550 130"/>
    <path d="M380 180 L 430 180 L 470 220 L 550 220"/>
    <path d="M380 270 L 450 270 L 490 230 L 550 230"/>
  </g>

  <!-- Via Holes -->
  <g fill="#022c22" stroke="url(#copper-grad)" stroke-width="2">
    <circle cx="120" cy="120" r="4"/>
    <circle cx="160" cy="80" r="4"/>
    <circle cx="140" cy="150" r="4"/>
    <circle cx="180" cy="190" r="4"/>
    <circle cx="440" cy="90" r="4"/>
    <circle cx="480" cy="130" r="4"/>
    <circle cx="470" cy="220" r="4"/>
  </g>

  <!-- Central ARM Cortex Microcontroller Board -->
  <rect x="220" y="70" width="160" height="220" rx="10" fill="#042f2e" stroke="#34d399" stroke-width="2"/>
  
  <!-- MCU Chip (STM32 / ARM Cortex-M) -->
  <rect x="250" y="105" width="100" height="100" rx="8" fill="#064e3b" stroke="url(#copper-grad)" stroke-width="2"/>
  
  <!-- Chip Text & Architecture Mark -->
  <text x="300" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">ARM</text>
  <text x="300" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a7f3d0">CORTEX-M4</text>
  <text x="300" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">FreeRTOS</text>

  <!-- Pin Headers on MCU Board -->
  <!-- Left Header -->
  <g fill="url(#copper-grad)">
    <rect x="226" y="85" width="6" height="6"/>
    <rect x="226" y="100" width="6" height="6"/>
    <rect x="226" y="115" width="6" height="6"/>
    <rect x="226" y="130" width="6" height="6"/>
    <rect x="226" y="145" width="6" height="6"/>
    <rect x="226" y="160" width="6" height="6"/>
    <rect x="226" y="175" width="6" height="6"/>
    <rect x="226" y="190" width="6" height="6"/>
    <rect x="226" y="205" width="6" height="6"/>
    <rect x="226" y="220" width="6" height="6"/>
    <rect x="226" y="235" width="6" height="6"/>
    <rect x="226" y="250" width="6" height="6"/>
    <rect x="226" y="265" width="6" height="6"/>
    <!-- Right Header -->
    <rect x="368" y="85" width="6" height="6"/>
    <rect x="368" y="100" width="6" height="6"/>
    <rect x="368" y="115" width="6" height="6"/>
    <rect x="368" y="130" width="6" height="6"/>
    <rect x="368" y="145" width="6" height="6"/>
    <rect x="368" y="160" width="6" height="6"/>
    <rect x="368" y="175" width="6" height="6"/>
    <rect x="368" y="190" width="6" height="6"/>
    <rect x="368" y="205" width="6" height="6"/>
    <rect x="368" y="220" width="6" height="6"/>
    <rect x="368" y="235" width="6" height="6"/>
    <rect x="368" y="250" width="6" height="6"/>
    <rect x="368" y="265" width="6" height="6"/>
  </g>

  <!-- Crystal Oscillator -->
  <rect x="270" y="225" width="60" height="20" rx="4" fill="#134e4a" stroke="#a7f3d0" stroke-width="1"/>
  <text x="300" y="239" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">16.000 MHz</text>

  <!-- Communication Bus Indicators -->
  <g font-family="monospace" font-size="10" font-weight="bold">
    <rect x="42" y="82" width="70" height="22" rx="4" fill="#042f2e" stroke="#f59e0b" stroke-width="1"/>
    <text x="77" y="97" text-anchor="middle" fill="#f59e0b">CAN BUS</text>

    <rect x="42" y="140" width="70" height="22" rx="4" fill="#042f2e" stroke="#34d399" stroke-width="1"/>
    <text x="77" y="155" text-anchor="middle" fill="#34d399">SPI / I2C</text>

    <rect x="480" y="80" width="75" height="22" rx="4" fill="#042f2e" stroke="#34d399" stroke-width="1"/>
    <text x="517" y="95" text-anchor="middle" fill="#34d399">UART / USB</text>

    <rect x="480" y="168" width="75" height="22" rx="4" fill="#042f2e" stroke="#f59e0b" stroke-width="1"/>
    <text x="517" y="183" text-anchor="middle" fill="#f59e0b">EMB LINUX</text>
  </g>

  <!-- Oscilloscope Signal wave on bottom -->
  <g stroke="#34d399" stroke-width="2" fill="none" opacity="0.85">
    <path d="M40 310 H 90 L 110 280 L 140 330 L 160 300 L 180 320 H 230"/>
    <text x="40" y="275" font-family="monospace" font-size="10" fill="#34d399">LOGIC ANALYZER</text>
  </g>

  <!-- Domain Tag -->
  <rect x="38" y="36" width="140" height="26" rx="6" fill="#042f2e" stroke="#34d399" stroke-width="1"/>
  <text x="50" y="53" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" letter-spacing="1">ARM & FIRMWARE</text>
</svg>
