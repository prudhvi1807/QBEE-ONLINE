<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="edge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#edge-bg)"/>

  <!-- Neural Net Grid Lines -->
  <g opacity="0.15" stroke="#c084fc" stroke-width="1">
    <circle cx="300" cy="180" r="160" fill="none"/>
    <circle cx="300" cy="180" r="110" fill="none"/>
    <circle cx="300" cy="180" r="60" fill="none"/>
    <line x1="140" y1="180" x2="460" y2="180"/>
    <line x1="300" y1="20" x2="300" y2="340"/>
  </g>

  <!-- Neural Network Synapse Connections -->
  <g stroke="#a855f7" stroke-width="1.5" opacity="0.6">
    <!-- Layer 1 to Layer 2 -->
    <line x1="130" y1="110" x2="230" y2="90"/>
    <line x1="130" y1="110" x2="230" y2="150"/>
    <line x1="130" y1="110" x2="230" y2="210"/>
    <line x1="130" y1="180" x2="230" y2="90"/>
    <line x1="130" y1="180" x2="230" y2="150"/>
    <line x1="130" y1="180" x2="230" y2="210"/>
    <line x1="130" y1="180" x2="230" y2="270"/>
    <line x1="130" y1="250" x2="230" y2="150"/>
    <line x1="130" y1="250" x2="230" y2="210"/>
    <line x1="130" y1="250" x2="230" y2="270"/>

    <!-- Layer 2 to Layer 3 (Center NPU) -->
    <line x1="230" y1="90" x2="300" y2="130"/>
    <line x1="230" y1="150" x2="300" y2="130"/>
    <line x1="230" y1="150" x2="300" y2="230"/>
    <line x1="230" y1="210" x2="300" y2="230"/>
    <line x1="230" y1="270" x2="300" y2="230"/>

    <!-- Layer 3 to Layer 4 -->
    <line x1="300" y1="130" x2="370" y2="90"/>
    <line x1="300" y1="130" x2="370" y2="150"/>
    <line x1="300" y1="230" x2="370" y2="210"/>
    <line x1="300" y1="230" x2="370" y2="270"/>

    <!-- Layer 4 to Output -->
    <line x1="370" y1="90" x2="470" y2="130"/>
    <line x1="370" y1="150" x2="470" y2="130"/>
    <line x1="370" y1="210" x2="470" y2="230"/>
    <line x1="370" y1="270" x2="470" y2="230"/>
  </g>

  <!-- Neural Nodes -->
  <!-- Layer 1 Nodes -->
  <g fill="#38bdf8" stroke="#ffffff" stroke-width="1.5">
    <circle cx="130" cy="110" r="7"/>
    <circle cx="130" cy="180" r="7"/>
    <circle cx="130" cy="250" r="7"/>
  </g>

  <!-- Layer 2 Nodes -->
  <g fill="#c084fc" stroke="#ffffff" stroke-width="1.5">
    <circle cx="230" cy="90" r="8"/>
    <circle cx="230" cy="150" r="8"/>
    <circle cx="230" cy="210" r="8"/>
    <circle cx="230" cy="270" r="8"/>
  </g>

  <!-- Central Edge AI / Tensor Core Chip -->
  <rect x="255" y="135" width="90" height="90" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <rect x="270" y="150" width="60" height="60" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">TENSOR</text>
  <text x="300" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#c084fc">TinyML</text>

  <!-- Layer 4 Nodes -->
  <g fill="#c084fc" stroke="#ffffff" stroke-width="1.5">
    <circle cx="370" cy="90" r="8"/>
    <circle cx="370" cy="150" r="8"/>
    <circle cx="370" cy="210" r="8"/>
    <circle cx="370" cy="270" r="8"/>
  </g>

  <!-- Layer 5 (Output & Vision) -->
  <g fill="#f59e0b" stroke="#ffffff" stroke-width="1.5">
    <circle cx="470" cy="130" r="9"/>
    <circle cx="470" cy="230" r="9"/>
  </g>

  <!-- Computer Vision Bounding Box Overlay -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <rect x="420" y="80" width="130" height="90" rx="4" stroke-dasharray="4 2"/>
    <rect x="420" y="65" width="80" height="18" fill="#0284c7"/>
    <text x="426" y="78" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">PERSON 98%</text>
  </g>

  <!-- Edge Device Specs badge -->
  <g font-family="monospace" font-size="10">
    <rect x="40" y="290" width="115" height="24" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
    <text x="97" y="306" text-anchor="middle" fill="#c084fc">NVIDIA JETSON</text>

    <rect x="165" y="290" width="115" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="222" y="306" text-anchor="middle" fill="#38bdf8">TFLITE MICRO</text>

    <rect x="290" y="290" width="105" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="342" y="306" text-anchor="middle" fill="#f59e0b">INT8 OPTIMIZED</text>
  </g>

  <!-- Domain Tag -->
  <rect x="38" y="36" width="150" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
  <text x="50" y="53" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc" letter-spacing="1">TINYML & VISION</text>
</svg>
