<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="vlsi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b59"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#vlsi-bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="60" y1="0" x2="600" y2="0"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="420" y1="0" x2="420" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="540" y1="0" x2="540" y2="360"/>
  </g>

  <!-- Circuit Traces & Bus Lines -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <path d="M40 180 H 160 L 210 130 H 260"/>
    <path d="M40 210 H 140 L 190 260 H 260"/>
    <path d="M340 130 H 410 L 450 180 H 560"/>
    <path d="M340 260 H 420 L 460 210 H 560"/>
    <path d="M300 40 V 100"/>
    <path d="M300 320 V 260"/>
  </g>

  <!-- Nodes -->
  <g fill="#38bdf8">
    <circle cx="160" cy="180" r="4"/>
    <circle cx="210" cy="130" r="4"/>
    <circle cx="140" cy="210" r="4"/>
    <circle cx="190" cy="260" r="4"/>
    <circle cx="410" cy="130" r="4"/>
    <circle cx="450" cy="180" r="4"/>
    <circle cx="420" cy="260" r="4"/>
    <circle cx="460" cy="210" r="4"/>
  </g>

  <!-- Central Chip Package (QFP / BGA) -->
  <rect x="230" y="110" width="140" height="140" rx="12" fill="#091428" stroke="url(#gold-grad)" stroke-width="3"/>
  <rect x="250" y="130" width="100" height="100" rx="6" fill="#172554" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Silicon Die Pattern -->
  <g stroke="url(#gold-grad)" stroke-width="1" opacity="0.8">
    <rect x="265" y="145" width="30" height="30" fill="#1e3a8a"/>
    <rect x="305" y="145" width="30" height="30" fill="#1e3a8a"/>
    <rect x="265" y="185" width="30" height="30" fill="#1e3a8a"/>
    <rect x="305" y="185" width="30" height="30" fill="#1e3a8a"/>
    <line x1="280" y1="145" x2="280" y2="215"/>
    <line x1="320" y1="145" x2="320" y2="215"/>
    <line x1="265" y1="160" x2="335" y2="160"/>
    <line x1="265" y1="200" x2="335" y2="200"/>
  </g>

  <!-- Chip Pins -->
  <g fill="url(#gold-grad)">
    <!-- Top Pins -->
    <rect x="250" y="102" width="6" height="8"/>
    <rect x="270" y="102" width="6" height="8"/>
    <rect x="290" y="102" width="6" height="8"/>
    <rect x="310" y="102" width="6" height="8"/>
    <rect x="330" y="102" width="6" height="8"/>
    <rect x="344" y="102" width="6" height="8"/>
    <!-- Bottom Pins -->
    <rect x="250" y="250" width="6" height="8"/>
    <rect x="270" y="250" width="6" height="8"/>
    <rect x="290" y="250" width="6" height="8"/>
    <rect x="310" y="250" width="6" height="8"/>
    <rect x="330" y="250" width="6" height="8"/>
    <rect x="344" y="250" width="6" height="8"/>
    <!-- Left Pins -->
    <rect x="222" y="130" width="8" height="6"/>
    <rect x="222" y="150" width="8" height="6"/>
    <rect x="222" y="170" width="8" height="6"/>
    <rect x="222" y="190" width="8" height="6"/>
    <rect x="222" y="210" width="8" height="6"/>
    <rect x="222" y="224" width="8" height="6"/>
    <!-- Right Pins -->
    <rect x="370" y="130" width="8" height="6"/>
    <rect x="370" y="150" width="8" height="6"/>
    <rect x="370" y="170" width="8" height="6"/>
    <rect x="370" y="190" width="8" height="6"/>
    <rect x="370" y="210" width="8" height="6"/>
    <rect x="370" y="224" width="8" height="6"/>
  </g>

  <!-- Waveform overlay on bottom left -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8">
    <path d="M50 300 H 70 V 275 H 100 V 300 H 130 V 275 H 160 V 300 H 190 V 275 H 220 V 300"/>
    <text x="50" y="265" font-family="monospace" font-size="11" fill="#38bdf8">CLK 500MHz</text>
  </g>

  <!-- Logic Gate on top right -->
  <g stroke="url(#gold-grad)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M470 70 H 495 C 515 70, 525 85, 525 90 C 525 95, 515 110, 495 110 H 470 Z"/>
    <line x1="450" y1="80" x2="470" y2="80"/>
    <line x1="450" y1="100" x2="470" y2="100"/>
    <line x1="525" y1="90" x2="550" y2="90"/>
    <circle cx="450" cy="80" r="2.5" fill="#fbbf24"/>
    <circle cx="450" cy="100" r="2.5" fill="#fbbf24"/>
    <circle cx="550" cy="90" r="2.5" fill="#fbbf24"/>
    <text x="478" y="94" font-family="monospace" font-size="10" fill="#fbbf24">AND</text>
  </g>

  <!-- Tag / Label -->
  <rect x="38" y="36" width="100" height="26" rx="6" fill="#091428" stroke="#38bdf8" stroke-width="1"/>
  <text x="50" y="53" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" letter-spacing="1">RTL & ASIC</text>
</svg>
